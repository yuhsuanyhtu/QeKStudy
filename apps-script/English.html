<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QeKStudy English</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, sans-serif;
      color: #18212f;
      background: #f5f7fb;
    }
    body { margin: 0; }
    main {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }
    .panel {
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 16px;
      padding: 18px;
      margin-top: 16px;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    button, input { font: inherit; }
    button {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
    button.primary {
      background: #172033;
      color: #fff;
      border-color: #172033;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      min-width: 220px;
    }
    .muted { color: #667085; }
    .hidden { display: none; }
    .stat { font-weight: 700; }
    .error { color: #b42318; }
    .ok { color: #067647; }
    .word {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
<main>
  <h1>QeKStudy · English</h1>
  <p class="muted">
    受控單一學生版本。題目由 GitHub repo JSON 載入；學習紀錄寫入 Google Sheet。
  </p>

  <section class="panel">
    <div class="row">
      <div class="stat">今日英文：<span id="today-earned">—</span></div>
      <div class="stat">saving pool / 待領零用金：<span id="saving-pool">—</span></div>
      <div class="muted">內容版本：<span id="catalog-version">—</span></div>
    </div>
  </section>

  <section class="panel" id="home">
    <h2>今天要做什麼？</h2>
    <div class="row">
      <button id="start-flashcards" class="primary" disabled>單字閃卡</button>
      <button id="start-quiz" disabled>中翻英測驗</button>
    </div>
  </section>

  <section class="panel hidden" id="flashcards">
    <h2>單字閃卡</h2>
    <p id="flashcard-word" class="word"></p>
    <p id="flashcard-meaning" class="muted"></p>
    <p>已看滿 1 秒：<span id="flashcard-progress">0 / 0</span></p>
    <div class="row">
      <button id="flashcard-prev">上一個</button>
      <button id="flashcard-next">下一個</button>
      <button id="flashcard-back">回首頁</button>
      <button id="flashcard-save-retry" class="hidden">重新儲存閃卡紀錄</button>
    </div>
    <p id="flashcard-result"></p>
  </section>

  <section class="panel hidden" id="quiz">
    <h2>中翻英 / 測驗</h2>
    <p id="question-kind" class="muted"></p>
    <p id="question-text" class="word">題目</p>
    <div id="answer-area"></div>

    <div class="row" style="margin-top: 12px">
      <button id="submit-answer" class="primary">送出</button>
      <button id="retry-answer" class="hidden">再試一次</button>
      <button id="continue-question" class="hidden">繼續下一題</button>
      <button id="quiz-back">回首頁</button>
    </div>

    <p id="answer-result"></p>
    <p id="review-target" class="muted">複習方向會顯示在這裡。</p>
  </section>

  <section class="panel" id="summary">
    <h2>本輪結果</h2>
    <p>第一次答對：<span id="first-try-count">0</span></p>
    <p>重試後答對：<span id="retry-correct-count">0</span></p>
    <p>還沒解決：<span id="unresolved-count">0</span></p>
    <p>複習：<span id="review-summary">尚無</span></p>
  </section>

  <p id="status" role="status"></p>
  <button id="reload-bootstrap" class="hidden">重新載入</button>
</main>

<script>
var bootstrap = null;
var flashIndex = 0;
var flashSessionId = "";
var flashExposure = {};
var flashLastTick = null;
var flashSubmitted = false;
var flashSaveInFlight = false;
var flashSaveFailed = false;

var quizIndex = 0;
var quizSessionId = "";
var currentResolved = false;
var firstTryCount = 0;
var retryCorrectCount = 0;
var unresolvedCount = 0;
var reviewItems = [];
var answerInFlight = false;
var currentAttemptNo = 1;
var baseStatusText = "";

var ERROR_MESSAGES = {
  TRANSPORT: "連線中斷或伺服器沒有回應，無法確認這次是否已記錄。可以直接再試一次：同一次作答不會被重複記錄或重複給獎勵。",
  SERVER_BUSY: "伺服器忙碌，這次沒有記錄。請稍等一下再試一次。",
  PERSISTENCE: "寫入 Google Sheet 失敗。可以再試一次：同一次作答不會被重複記錄或重複給獎勵。",
  CONTENT: "題目內容暫時無法載入，請稍後按重新載入。",
  REQUEST: "這次送出的資料不完整，請重新開始這一項練習。",
  CONFIGURATION: "學習頁的伺服器設定有問題，請通知家長。",
  SERVER: "伺服器發生未預期的錯誤，請稍後再試。"
};

function newSessionId(prefix) {
  return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
}

function show(viewId) {
  ["home", "flashcards", "quiz"].forEach(function(name) {
    document.getElementById(name).classList.toggle("hidden", name !== viewId);
  });
}

function setMoney(today, pool) {
  if (!bootstrap) return;

  if (today !== null && today !== undefined) {
    bootstrap.todayEnglishEarned = today;
  }
  if (pool !== null && pool !== undefined) {
    bootstrap.savingPool = pool;
  }

  var todayText = "$" + bootstrap.todayEnglishEarned + " / ";
  todayText += bootstrap.rewardConfigured
    ? "$" + bootstrap.dailyCap
    : "獎勵尚未設定";

  document.getElementById("today-earned").textContent = todayText;
  document.getElementById("saving-pool").textContent = "$" + bootstrap.savingPool;
}

function load() {
  document.getElementById("reload-bootstrap").classList.add("hidden");
  setStatus("正在載入學習資料…", "muted");

  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || !result.ok) {
        showBootstrapError(result && result.error);
        return;
      }

      bootstrap = result.data;
      document.getElementById("catalog-version").textContent =
        bootstrap.catalogVersion;

      baseStatusText = bootstrap.rewardConfigured
        ? ""
        : "目前先測學習與紀錄流程；正式零用金金額尚未確認，因此不會加錢。";
      restoreStatus();

      setMoney(bootstrap.todayEnglishEarned, bootstrap.savingPool);
      renderFlashcard();
      renderQuizQuestion();
      document.getElementById("start-flashcards").disabled = false;
      document.getElementById("start-quiz").disabled = false;
    })
    .withFailureHandler(function() {
      showBootstrapError(transportError());
    })
    .apiEnglishBootstrap();
}

function showBootstrapError(error) {
  showError(error);
  document.getElementById("reload-bootstrap").classList.remove("hidden");
}

function tickFlashcard() {
  if (
    !bootstrap ||
    document.hidden ||
    document.getElementById("flashcards").classList.contains("hidden")
  ) {
    flashLastTick = null;
    return;
  }

  var now = performance.now();

  if (flashLastTick === null) {
    flashLastTick = now;
    return;
  }

  var word = bootstrap.lesson.words[flashIndex];
  var delta = Math.max(0, now - flashLastTick);

  flashExposure[word.wordId] =
    (flashExposure[word.wordId] || 0) + delta;

  flashLastTick = now;
  renderFlashProgress();
  maybeCompleteFlashcards();
}

function renderFlashProgress() {
  if (!bootstrap) return;

  var words = bootstrap.lesson.words || [];
  var qualified = words.filter(function(word) {
    return Number(flashExposure[word.wordId] || 0) >= 1000;
  }).length;

  document.getElementById("flashcard-progress").textContent =
    qualified + " / " + words.length;
}

function renderFlashcard() {
  if (!bootstrap || !bootstrap.lesson) return;

  var words = bootstrap.lesson.words || [];
  if (!words.length) return;

  var word = words[flashIndex];

  document.getElementById("flashcard-word").textContent = word.english;
  document.getElementById("flashcard-meaning").textContent = word.chinese;

  renderFlashProgress();
  flashLastTick = performance.now();
}

function switchCard(delta) {
  tickFlashcard();

  if (!bootstrap) return;

  var words = bootstrap.lesson.words || [];
  flashIndex = (flashIndex + delta + words.length) % words.length;

  renderFlashcard();
}

function maybeCompleteFlashcards() {
  // A failed save waits for the student's explicit retry instead of being
  // resent on every 200ms tick.
  if (!bootstrap || flashSubmitted || flashSaveInFlight || flashSaveFailed) return;

  var words = bootstrap.lesson.words || [];
  var complete =
    words.length > 0 &&
    words.every(function(word) {
      return Number(flashExposure[word.wordId] || 0) >= 1000;
    });

  if (!complete) return;

  saveFlashcards();
}

function saveFlashcards() {
  var requestSessionId = flashSessionId;
  flashSaveInFlight = true;
  flashSaveFailed = false;
  document.getElementById("flashcard-save-retry").classList.add("hidden");
  setStatus("正在儲存閃卡完成紀錄…", "muted");

  google.script.run
    .withSuccessHandler(function(result) {
      flashSaveInFlight = false;

      if (!result || !result.ok) {
        flashSaveFailedFor(requestSessionId, result && result.error);
        return;
      }

      var data = result.data;
      setMoney(data.todayEnglishEarned, data.savingPool);
      restoreStatus();
      if (requestSessionId !== flashSessionId) return;

      flashSubmitted = true;
      document.getElementById("flashcard-result").className = "ok";
      document.getElementById("flashcard-result").textContent =
        data.rewardConfigured
          ? "整課完成，本次 +$" + data.rewardAmount
          : "整課完成；零用金規則尚未設定，本次先記錄學習但不加錢。";
    })
    .withFailureHandler(function() {
      flashSaveInFlight = false;
      flashSaveFailedFor(requestSessionId, transportError());
    })
    .apiEnglishCompleteFlashcards({
      sessionId: requestSessionId,
      lessonId: bootstrap.lesson.lessonId,
      revision: bootstrap.lesson.revision,
      exposureByWordId: flashExposure
    });
}

function flashSaveFailedFor(requestSessionId, error) {
  showError(error);
  if (requestSessionId !== flashSessionId) return;
  flashSaveFailed = true;
  document.getElementById("flashcard-save-retry").classList.remove("hidden");
}

function renderQuizQuestion() {
  if (!bootstrap) return;

  var quiz = bootstrap.quiz || [];
  var question = quiz[quizIndex];

  if (!question) {
    document.getElementById("question-kind").textContent = "";
    document.getElementById("question-text").textContent = "這一輪完成了";
    document.getElementById("answer-area").innerHTML = "";
    document.getElementById("submit-answer").classList.add("hidden");
    document.getElementById("retry-answer").classList.add("hidden");
    document.getElementById("continue-question").classList.add("hidden");
    return;
  }

  currentResolved = false;
  currentAttemptNo = 1;

  document.getElementById("question-kind").textContent =
    question.sourceType + " · " + question.kind;
  document.getElementById("question-text").textContent = question.prompt;
  document.getElementById("answer-result").textContent = "";
  document.getElementById("review-target").textContent =
    "複習方向會顯示在這裡。";

  document.getElementById("submit-answer").classList.remove("hidden");
  document.getElementById("retry-answer").classList.add("hidden");
  document.getElementById("continue-question").classList.add("hidden");

  var area = document.getElementById("answer-area");

  if (question.kind === "MULTIPLE_CHOICE") {
    area.innerHTML = (question.choices || [])
      .map(function(choice) {
        return (
          '<label style="display:block;margin:8px 0">' +
          '<input type="radio" name="choice" value="' +
          escapeHtml(choice.choiceId) +
          '"> ' +
          escapeHtml(choice.label) +
          "</label>"
        );
      })
      .join("");
  } else {
    area.innerHTML =
      '<input id="answer-input" autocomplete="off" placeholder="輸入英文答案">';
  }
}

function currentQuestion() {
  return bootstrap && bootstrap.quiz
    ? bootstrap.quiz[quizIndex]
    : null;
}

function setAnswerBusy(busy) {
  answerInFlight = busy;
  ["submit-answer", "retry-answer", "continue-question"].forEach(function(id) {
    document.getElementById(id).disabled = busy;
  });
}

function submitAnswer() {
  if (answerInFlight) return;
  var question = currentQuestion();
  if (!question) return;

  var requestSessionId = quizSessionId;
  var requestIndex = quizIndex;
  // Same number on a resend after a lost response, so the server replays the
  // recorded attempt instead of adding another one.
  var input = {
    sessionId: quizSessionId,
    questionId: question.questionId,
    revision: question.revision,
    clientAttemptNo: currentAttemptNo
  };

  if (question.kind === "MULTIPLE_CHOICE") {
    var selected = document.querySelector('input[name="choice"]:checked');
    input.selectedChoiceId = selected ? selected.value : "";
  } else {
    var answerInput = document.getElementById("answer-input");
    input.answer = answerInput ? answerInput.value : "";
  }

  setAnswerBusy(true);
  setStatus("正在判定並儲存作答…", "muted");

  google.script.run
    .withSuccessHandler(function(result) {
      setAnswerBusy(false);

      if (!result || !result.ok) {
        showError(result && result.error);
        return;
      }

      var data = result.data;
      setMoney(data.todayEnglishEarned, data.savingPool);
      restoreStatus();
      // The student already moved on; never paint this result onto another question.
      if (requestSessionId !== quizSessionId || requestIndex !== quizIndex) return;

      currentAttemptNo = Number(data.attemptNo) + 1;

      if (data.correct) {
        currentResolved = true;

        document.getElementById("answer-result").className = "ok";
        document.getElementById("answer-result").textContent =
          data.rewardConfigured
            ? "答對了，本題 +$" + data.rewardAmount
            : "答對了；零用金規則尚未設定，本題先記錄但不加錢。";

        document.getElementById("review-target").textContent = "";

        if (data.attemptNo === 1) {
          firstTryCount += 1;
        } else {
          retryCorrectCount += 1;
        }

        document.getElementById("submit-answer").classList.add("hidden");
        document.getElementById("retry-answer").classList.add("hidden");
        document.getElementById("continue-question").textContent = "下一題";
        document.getElementById("continue-question").classList.remove("hidden");
      } else {
        document.getElementById("answer-result").className = "error";
        document.getElementById("answer-result").textContent = "這次答錯了";
        document.getElementById("review-target").textContent =
          "複習：" + (data.reviewTarget || "請回到對應內容確認");

        document.getElementById("retry-answer").classList.remove("hidden");
        document.getElementById("continue-question").textContent =
          "繼續下一題";
        document.getElementById("continue-question").classList.remove("hidden");

        if (
          data.reviewTarget &&
          reviewItems.indexOf(data.reviewTarget) === -1
        ) {
          reviewItems.push(data.reviewTarget);
        }
      }

      renderSummary();
    })
    .withFailureHandler(function() {
      setAnswerBusy(false);
      showError(transportError());
    })
    .apiEnglishSubmitAnswer(input);
}

function continueQuestion() {
  if (answerInFlight) return;
  var question = currentQuestion();

  if (question && !currentResolved) {
    unresolvedCount += 1;
  }

  quizIndex += 1;
  renderSummary();
  renderQuizQuestion();
}

function renderSummary() {
  document.getElementById("first-try-count").textContent = firstTryCount;
  document.getElementById("retry-correct-count").textContent =
    retryCorrectCount;
  document.getElementById("unresolved-count").textContent = unresolvedCount;
  document.getElementById("review-summary").textContent =
    reviewItems.length ? reviewItems.join("；") : "尚無";
}

function setStatus(text, className) {
  var status = document.getElementById("status");
  status.className = className || "";
  status.textContent = text;
}

function restoreStatus() {
  setStatus(baseStatusText, "muted");
}

function transportError() {
  return { code: "SERVER_REQUEST_FAILED", category: "TRANSPORT" };
}

function showError(error) {
  var category = (error && error.category) || "SERVER";
  var code = (error && error.code) || category;
  setStatus(
    (ERROR_MESSAGES[category] || ERROR_MESSAGES.SERVER) + "（" + code + "）",
    "error"
  );
}

function escapeHtml(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

document.getElementById("start-flashcards").onclick = function() {
  flashSessionId = newSessionId("flash");
  flashExposure = {};
  flashIndex = 0;
  flashSubmitted = false;
  flashSaveFailed = false;
  document.getElementById("flashcard-save-retry").classList.add("hidden");
  document.getElementById("flashcard-result").textContent = "";

  show("flashcards");
  renderFlashcard();
};

document.getElementById("start-quiz").onclick = function() {
  quizSessionId = newSessionId("quiz");
  quizIndex = 0;
  firstTryCount = 0;
  retryCorrectCount = 0;
  unresolvedCount = 0;
  reviewItems = [];

  renderSummary();
  show("quiz");
  renderQuizQuestion();
};

document.getElementById("flashcard-prev").onclick = function() {
  switchCard(-1);
};

document.getElementById("flashcard-next").onclick = function() {
  switchCard(1);
};

document.getElementById("flashcard-back").onclick = function() {
  tickFlashcard();
  show("home");
};

document.getElementById("flashcard-save-retry").onclick = function() {
  if (flashSaveInFlight) return;
  saveFlashcards();
};

document.getElementById("reload-bootstrap").onclick = load;

document.getElementById("submit-answer").onclick = submitAnswer;

document.getElementById("retry-answer").onclick = function() {
  if (answerInFlight) return;
  document.getElementById("retry-answer").classList.add("hidden");
  document.getElementById("continue-question").classList.add("hidden");

  var answerInput = document.getElementById("answer-input");
  if (answerInput) {
    answerInput.value = "";
    answerInput.focus();
  }
};

document.getElementById("continue-question").onclick = continueQuestion;

document.getElementById("quiz-back").onclick = function() {
  show("home");
};

document.addEventListener("visibilitychange", function() {
  flashLastTick = document.hidden ? null : performance.now();
});

setInterval(tickFlashcard, 200);
load();
</script>
</body>
</html>
