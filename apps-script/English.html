<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QeKStudy English</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color:#18212f; background:#f5f7fb; }
    body { margin:0; }
    main { width:min(760px, calc(100% - 28px)); margin:0 auto; padding:28px 0 64px; }
    .panel { background:#fff; border:1px solid #e5e9f0; border-radius:16px; padding:18px; margin-top:16px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    button,input { font:inherit; }
    button { padding:10px 14px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; cursor:pointer; }
    button.primary { background:#172033; color:white; border-color:#172033; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    input { padding:10px; border:1px solid #cbd5e1; border-radius:10px; min-width:220px; }
    .muted { color:#667085; }
    .hidden { display:none; }
    .stat { font-weight:700; }
    .error { color:#b42318; }
    .ok { color:#067647; }
    .word { font-size:2rem; font-weight:800; margin-bottom:4px; }
  </style>
</head>
<body>
<main>
  <h1>QeKStudy · English</h1>
  <p class="muted">受控單一學生版本。題目由 GitHub repo JSON 載入；學習紀錄寫入 Google Sheet。</p>

  <section class="panel">
    <div class="row">
      <div class="stat">今日英文：<span id="today-earned">—</span></div>
      <div class="stat">saving pool / 待領零用金：<span id="saving-pool">—</span></div>
      <div class="muted">內容版本：<span id="catalog-version">—</span></div>
    </div>
  </section>

  <section class="panel" id="home">
    <h2>今天要做什麼？</h2>
    <div class="row">
      <button id="start-flashcards" class="primary">單字閃卡</button>
      <button id="start-quiz">中翻英測驗</button>
    </div>
  </section>

  <section class="panel hidden" id="flashcards">
    <h2>單字閃卡</h2>
    <p id="flashcard-word" class="word"></p>
    <p id="flashcard-meaning" class="muted"></p>
    <p>已看滿 1 秒：<span id="flashcard-progress">0 / 0</span></p>
    <div class="row">
      <button id="flashcard-prev">上一個</button>
      <button id="flashcard-next">下一個</button>
      <button id="flashcard-back">回首頁</button>
    </div>
    <p id="flashcard-result"></p>
  </section>

  <section class="panel hidden" id="quiz">
    <h2>中翻英 / 測驗</h2>
    <p id="question-kind" class="muted"></p>
    <p id="question-text" class="word">題目</p>
    <div id="answer-area"></div>
    <div class="row" style="margin-top:12px">
      <button id="submit-answer" class="primary">送出</button>
      <button id="retry-answer" class="hidden">再試一次</button>
      <button id="continue-question" class="hidden">繼續下一題</button>
      <button id="quiz-back">回首頁</button>
    </div>
    <p id="answer-result"></p>
    <p id="review-target" class="muted">複習方向會顯示在這裡。</p>
  </section>

  <section class="panel" id="summary">
    <h2>本輪結果</h2>
    <p>第一次答對：<span id="first-try-count">0</span></p>
    <p>重試後答對：<span id="retry-correct-count">0</span></p>
    <p>還沒解決：<span id="unresolved-count">0</span></p>
    <p>複習：<span id="review-summary">尚無</span></p>
  </section>

  <p id="status" role="status"></p>
</main>
<script>
let bootstrap = null;
let flashIndex = 0;
let flashSessionId = '';
let flashExposure = {};
let flashLastTick = null;
let flashSubmitted = false;
let quizIndex = 0;
let quizSessionId = '';
let currentResolved = false;
let firstTryCount = 0;
let retryCorrectCount = 0;
let unresolvedCount = 0;
let reviewItems = [];

function newSessionId(prefix) {
  return prefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}

function show(id) {
  ['home','flashcards','quiz'].forEach(function(name) {
    document.getElementById(name).classList.toggle('hidden', name !== id);
  });
}

function setMoney(today, pool) {
  if (!bootstrap) return;
  if (today != null) bootstrap.todayEnglishEarned = today;
  if (pool != null) bootstrap.savingPool = pool;
  document.getElementById('today-earned').textContent =
    '$' + bootstrap.todayEnglishEarned + ' / $' + bootstrap.dailyCap;
  document.getElementById('saving-pool').textContent = '$' + bootstrap.savingPool;
}

function load() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || !result.ok) return showError(result && result.error);
      bootstrap = result.data;
      document.getElementById('catalog-version').textContent = bootstrap.catalogVersion;
      setMoney(bootstrap.todayEnglishEarned, bootstrap.savingPool);
      renderFlashcard();
      renderQuizQuestion();
    })
    .withFailureHandler(function() { showError({ code:'PERSISTENCE_FAILED' }); })
    .apiEnglishBootstrap();
}

function tickFlashcard() {
  if (!bootstrap || document.hidden || document.getElementById('flashcards').classList.contains('hidden')) {
    flashLastTick = null;
    return;
  }
  const now = performance.now();
  if (flashLastTick == null) {
    flashLastTick = now;
    return;
  }
  const word = bootstrap.lesson.words[flashIndex];
  const delta = Math.max(0, now - flashLastTick);
  flashExposure[word.wordId] = (flashExposure[word.wordId] || 0) + delta;
  flashLastTick = now;
  renderFlashProgress();
  maybeCompleteFlashcards();
}

function renderFlashProgress() {
  if (!bootstrap) return;
  const words = bootstrap.lesson.words || [];
  const qualified = words.filter(function(word) {
    return Number(flashExposure[word.wordId] || 0) >= 1000;
  }).length;
  document.getElementById('flashcard-progress').textContent = qualified + ' / ' + words.length;
}

function renderFlashcard() {
  if (!bootstrap || !bootstrap.lesson) return;
  const words = bootstrap.lesson.words || [];
  if (!words.length) return;
  const word = words[flashIndex];
  document.getElementById('flashcard-word').textContent = word.english;
  document.getElementById('flashcard-meaning').textContent = word.chinese;
  renderFlashProgress();
  flashLastTick = performance.now();
}

function switchCard(delta) {
  tickFlashcard();
  if (!bootstrap) return;
  const words = bootstrap.lesson.words || [];
  flashIndex = (flashIndex + delta + words.length) % words.length;
  renderFlashcard();
}

function maybeCompleteFlashcards() {
  if (!bootstrap || flashSubmitted) return;
  const words = bootstrap.lesson.words || [];
  const complete = words.length > 0 && words.every(function(word) {
    return Number(flashExposure[word.wordId] || 0) >= 1000;
  });
  if (!complete) return;

  flashSubmitted = true;
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result || !result.ok) {
        flashSubmitted = false;
        return showError(result && result.error);
      }
      const data = result.data;
      document.getElementById('flashcard-result').className = 'ok';
      document.getElementById('flashcard-result').textContent =
        '整課完成，本次 +$' + data.rewardAmount;
      setMoney(data.todayEnglishEarned, data.savingPool);
    })
    .withFailureHandler(function() {
      flashSubmitted = false;
      showError({ code:'PERSISTENCE_FAILED' });
    })
    .apiEnglishCompleteFlashcards({
      sessionId: flashSessionId,
      lessonId: bootstrap.lesson.lessonId,
      revision: bootstrap.lesson.revision,
      exposureByWordId: flashExposure
    });
}

function renderQuizQuestion() {
  if (!bootstrap) return;
  const quiz = bootstrap.quiz || [];
  const q = quiz[quizIndex];
  if (!q) {
    document.getElementById('question-kind').textContent = '';
    document.getElementById('question-text').textContent = '這一輪完成了';
    document.getElementById('answer-area').innerHTML = '';
    document.getElementById('submit-answer').classList.add('hidden');
    document.getElementById('retry-answer').classList.add('hidden');
    document.getElementById('continue-question').classList.add('hidden');
    return;
  }

  currentResolved = false;
  document.getElementById('question-kind').textContent =
    q.sourceType + ' · ' + q.kind;
  document.getElementById('question-text').textContent = q.prompt;
  document.getElementById('answer-result').textContent = '';
  document.getElementById('review-target').textContent = '複習方向會顯示在這裡。';
  document.getElementById('submit-answer').classList.remove('hidden');
  document.getElementById('retry-answer').classList.add('hidden');
  document.getElementById('continue-question').classList.add('hidden');

  const area = document.getElementById('answer-area');
  if (q.kind === 'MULTIPLE_CHOICE') {
    area.innerHTML = (q.choices || []).map(function(choice) {
      return '<label style="display:block;margin:8px 0"><input type="radio" name="choice" value="' +
        escapeHtml(choice.choiceId) + '"> ' + escapeHtml(choice.label) + '</label>';
    }).join('');
  } else {
    area.innerHTML = '<input id="answer-input" autocomplete="off" placeholder="輸入英文答案">';
  }
}

function currentQuestion() {
  return bootstrap && bootstrap.quiz ? bootstrap.quiz[quizIndex] : null;
}

function submitAnswer() {
  const q = currentQuestion();
  if (!q) return;

  const input = {
    sessionId: quizSessionId,
    questionId: q.questionId,
    revision: q.revision
  };

  if (q.kind === 'MULTIPLE_CHOICE') {
    const selected = document.querySelector('input[name="choice"]:checked');
    input.selectedChoiceId = selected ? selected.value : '';
  } else {
    const el = document.getElementById('answer-input');
    input.answer = el ? el.value : '';
  }

  document.getElementById('submit-answer').disabled = true;
  google.script.run
    .withSuccessHandler(function(result) {
      document.getElementById('submit-answer').disabled = false;
      if (!result || !result.ok) return showError(result && result.error);
      const data = result.data;
      setMoney(data.todayEnglishEarned, data.savingPool);

      if (data.correct) {
        currentResolved = true;
        document.getElementById('answer-result').className = 'ok';
        document.getElementById('answer-result').textContent =
          '答對了，本題 +$' + data.rewardAmount;
        document.getElementById('review-target').textContent = '';
        if (data.attemptNo === 1) firstTryCount += 1;
        else retryCorrectCount += 1;
        document.getElementById('submit-answer').classList.add('hidden');
        document.getElementById('retry-answer').classList.add('hidden');
        document.getElementById('continue-question').textContent = '下一題';
        document.getElementById('continue-question').classList.remove('hidden');
      } else {
        document.getElementById('answer-result').className = 'error';
        document.getElementById('answer-result').textContent = '這次答錯了';
        document.getElementById('review-target').textContent =
          '複習：' + (data.reviewTarget || '請回到對應內容確認');
        document.getElementById('retry-answer').classList.remove('hidden');
        document.getElementById('continue-question').textContent = '繼續下一題';
        document.getElementById('continue-question').classList.remove('hidden');
        if (data.reviewTarget && !reviewItems.includes(data.reviewTarget)) {
          reviewItems.push(data.reviewTarget);
        }
      }
      renderSummary();
    })
    .withFailureHandler(function() {
      document.getElementById('submit-answer').disabled = false;
      showError({ code:'PERSISTENCE_FAILED' });
    })
    .apiEnglishSubmitAnswer(input);
}

function continueQuestion() {
  const q = currentQuestion();
  if (q && !currentResolved) unresolvedCount += 1;
  quizIndex += 1;
  renderSummary();
  renderQuizQuestion();
}

function renderSummary() {
  document.getElementById('first-try-count').textContent = firstTryCount;
  document.getElementById('retry-correct-count').textContent = retryCorrectCount;
  document.getElementById('unresolved-count').textContent = unresolvedCount;
  document.getElementById('review-summary').textContent =
    reviewItems.length ? reviewItems.join('；') : '尚無';
}

function showError(error) {
  const el = document.getElementById('status');
  el.className = 'error';
  el.textContent = (error && error.code) || '無法載入資料';
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

document.getElementById('start-flashcards').onclick = function() {
  flashSessionId = newSessionId('flash');
  flashExposure = {};
  flashIndex = 0;
  flashSubmitted = false;
  show('flashcards');
  renderFlashcard();
};
document.getElementById('start-quiz').onclick = function() {
  quizSessionId = newSessionId('quiz');
  quizIndex = 0;
  firstTryCount = 0;
  retryCorrectCount = 0;
  unresolvedCount = 0;
  reviewItems = [];
  renderSummary();
  show('quiz');
  renderQuizQuestion();
};
document.getElementById('flashcard-prev').onclick = function() { switchCard(-1); };
document.getElementById('flashcard-next').onclick = function() { switchCard(1); };
document.getElementById('flashcard-back').onclick = function() { tickFlashcard(); show('home'); };
document.getElementById('submit-answer').onclick = submitAnswer;
document.getElementById('retry-answer').onclick = function() {
  document.getElementById('retry-answer').classList.add('hidden');
  document.getElementById('continue-question').classList.add('hidden');
  const input = document.getElementById('answer-input');
  if (input) {
    input.value = '';
    input.focus();
  }
};
document.getElementById('continue-question').onclick = continueQuestion;
document.getElementById('quiz-back').onclick = function() { show('home'); };

document.addEventListener('visibilitychange', function() {
  flashLastTick = document.hidden ? null : performance.now();
});
setInterval(tickFlashcard, 200);

load();
</script>
</body>
</html>
